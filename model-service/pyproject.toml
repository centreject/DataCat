[project]
name = "datacat-model-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "pillow>=10.4",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27"]
ml = [
    "ultralytics>=8.4",
    "faster-whisper>=1.2",
    # CTranslate2 needs CUDA 12 libraries even when torch is built for CUDA 13.
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12==9.*",
    "transformers>=5",
    "accelerate",
    "bitsandbytes",
]
eval = ["edge-tts>=7"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["gpu: needs CUDA and real weights"]
addopts = "-m 'not gpu' -rs"
