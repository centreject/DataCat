spring.datasource.url=jdbc:h2:mem:datacat_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

datacat.storage.snapshot-dir=${java.io.tmpdir}/datacat-tests/snapshots
datacat.model.base-url=http://localhost:8000

datacat.push.enabled=false