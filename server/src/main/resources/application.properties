spring.application.name=server

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/datacat}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=16MB
spring.servlet.multipart.max-request-size=17MB

datacat.storage.snapshot-dir=${SNAPSHOT_DIR:./data/snapshots}

datacat.model.base-url=${MODEL_SERVICE_URL:http://localhost:8000}

datacat.push.enabled=${FCM_ENABLED:false}
datacat.push.credentials-file=${FCM_CREDENTIALS_FILE:}