spring.application.name=server

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/datacat}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=16MB
spring.servlet.multipart.max-request-size=17MB

datacat.storage.snapshot-dir=${SNAPSHOT_DIR:./data/snapshots}

datacat.model.base-url=${MODEL_SERVICE_URL:http://localhost:8000}
datacat.model.audio-read-timeout-ms=${MODEL_AUDIO_READ_TIMEOUT_MS:5000}

# 세션 활동이 2분 없으면 종료. 5초마다 최대 100건 점검(단일 서버 MVP).
datacat.session.expiry-enabled=${SESSION_EXPIRY_ENABLED:true}
datacat.session.idle-timeout-ms=${SESSION_IDLE_TIMEOUT_MS:120000}
datacat.session.expiry-check-ms=${SESSION_EXPIRY_CHECK_MS:5000}

datacat.push.enabled=${FCM_ENABLED:false}
datacat.push.credentials-file=${FCM_CREDENTIALS_FILE:}
