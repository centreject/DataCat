name: datacat_frontdoor
description: DataCat 무인현관 — 방문 기록을 확인하는 모바일 앱
publish_to: 'none'
version: 0.3.0+3

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.3
  # 휴대폰 푸시 (FCM). 웹 빌드에도 들어가지만 웹에서는 켜지 않는다
  firebase_core: '>=3.6.0 <6.0.0'
  firebase_messaging: '>=15.1.0 <18.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
