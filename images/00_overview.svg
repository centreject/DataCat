<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920">
<rect width="1200" height="920" rx="28" fill="#F7F9FC"/>
<text x="600" y="62" text-anchor="middle" font-family="Malgun Gothic" font-size="38" font-weight="800" fill="#111827">무인현관 상황 분류 전체 구조</text>
<rect x="430" y="95" width="340" height="72" rx="18" fill="#203864"/>
<text x="600" y="140" text-anchor="middle" font-family="Malgun Gothic" font-size="26" font-weight="700" fill="#FFFFFF">ToF 또는 호출벨로 이벤트 시작</text>
<path d="M600 167 V220" stroke="#203864" stroke-width="6"/>
<rect x="425" y="220" width="350" height="76" rx="18" fill="#DCE6F1" stroke="#203864" stroke-width="4"/>
<text x="600" y="268" text-anchor="middle" font-family="Malgun Gothic" font-size="28" font-weight="700" fill="#111827">사람이 감지되었는가</text>
<path d="M425 258 H230 V350" stroke="#E58C3A" stroke-width="6" fill="none"/>
<text x="310" y="244" font-family="Malgun Gothic" font-size="22" font-weight="700" fill="#E58C3A">아니오</text>
<rect x="70" y="350" width="320" height="98" rx="18" fill="#FFF1E2" stroke="#E58C3A" stroke-width="4"/>
<text x="230" y="388" text-anchor="middle" font-family="Malgun Gothic" font-size="25" font-weight="700" fill="#111827">물품이 감지되었는가</text>
<text x="230" y="425" text-anchor="middle" font-family="Malgun Gothic" font-size="21" fill="#6B7280">예 물품만 있음  아니오 종료</text>
<path d="M775 258 H970 V350" stroke="#4F81BD" stroke-width="6" fill="none"/>
<text x="825" y="244" font-family="Malgun Gothic" font-size="22" font-weight="700" fill="#4F81BD">예</text>
<rect x="810" y="350" width="320" height="98" rx="18" fill="#EAF2F8" stroke="#4F81BD" stroke-width="4"/>
<text x="970" y="388" text-anchor="middle" font-family="Malgun Gothic" font-size="25" font-weight="700" fill="#111827">STT로 방문 목적 확인</text>
<text x="970" y="425" text-anchor="middle" font-family="Malgun Gothic" font-size="20" fill="#6B7280">명확한 표현을 우선 적용</text>
<path d="M970 448 V510 H600" stroke="#4F81BD" stroke-width="6" fill="none"/>
<path d="M230 448 V510 H600" stroke="#E58C3A" stroke-width="6" fill="none"/>
<rect x="460" y="500" width="280" height="70" rx="18" fill="#FFFFFF" stroke="#C94C4C" stroke-width="4"/>
<text x="600" y="543" text-anchor="middle" font-family="Malgun Gothic" font-size="24" font-weight="700" fill="#C94C4C">긴급·위험 신호 우선 확인</text>
<g font-family="Malgun Gothic" font-size="21" font-weight="700" text-anchor="middle">
<rect x="55" y="635" width="190" height="76" rx="16" fill="#FFFFFF" stroke="#E58C3A" stroke-width="4"/><text x="150" y="682" fill="#111827">물품만 있음</text>
<rect x="285" y="635" width="190" height="76" rx="16" fill="#FFFFFF" stroke="#4F81BD" stroke-width="4"/><text x="380" y="682" fill="#111827">배송</text>
<rect x="515" y="635" width="190" height="76" rx="16" fill="#FFFFFF" stroke="#4F9D69" stroke-width="4"/><text x="610" y="682" fill="#111827">수거</text>
<rect x="745" y="635" width="190" height="76" rx="16" fill="#FFFFFF" stroke="#8B6CC1" stroke-width="4"/><text x="840" y="682" fill="#111827">개인 방문</text>
<rect x="975" y="635" width="190" height="76" rx="16" fill="#FFFFFF" stroke="#6B7280" stroke-width="4"/><text x="1070" y="682" fill="#111827">작업 방문</text>
<rect x="55" y="760" width="190" height="76" rx="16" fill="#FFFFFF" stroke="#C94C4C" stroke-width="4"/><text x="150" y="807" fill="#111827">공공·긴급</text>
<rect x="285" y="760" width="190" height="76" rx="16" fill="#FFFFFF" stroke="#E58C3A" stroke-width="4"/><text x="380" y="807" fill="#111827">영업·홍보</text>
<rect x="515" y="760" width="190" height="76" rx="16" fill="#FFFFFF" stroke="#6C8EBF" stroke-width="4"/><text x="610" y="807" fill="#111827">잘못 방문</text>
<rect x="745" y="760" width="190" height="76" rx="16" fill="#FFFFFF" stroke="#C94C4C" stroke-width="4"/><text x="840" y="807" fill="#111827">안전 확인</text>
<rect x="975" y="760" width="190" height="76" rx="16" fill="#FFFFFF" stroke="#6B7280" stroke-width="4"/><text x="1070" y="807" fill="#111827">기타·판단 불가</text>
</g>
<text x="600" y="880" text-anchor="middle" font-family="Malgun Gothic" font-size="21" fill="#6B7280">불확실하거나 서로 충돌하는 입력은 임의 추정하지 않고 기타·판단 불가로 처리</text>
</svg>